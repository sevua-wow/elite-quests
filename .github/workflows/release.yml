name: Release

# Un tag vX.Y.Z poussé sur GitHub construit le zip et le publie sur CurseForge.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pour créer la release GitHub avec le zip
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # le packager construit le changelog depuis l'historique
      - uses: BigWigsMods/packager@v2
